document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0;\n  font-display: swap;\n  src: url(\"e1c48ab2-68da-474e-9db3-0bd64a76047b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Newsreader — editorial serif, used sparingly for display headlines & pull quotes */\n  --font-serif-display: 'Newsreader', 'Iowan Old Style', 'Georgia', serif;\n\n  /* Manrope — geometric-humanist sans, the workhorse UI/body typeface */\n  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* IBM Plex Mono — code, data, numerals, technical labels */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   Stratal — Color tokens\n   Warm-neutral ink scale + a rust/terracotta primary (deliberately not the\n   default SaaS blue-purple). Base primitives first, semantic aliases below.\n   ========================================================================== */\n\n:root {\n  /* ---- Primitives: Ink (warm neutral, slightly toward brown, not blue-gray) ---- */\n  --ink-0: #FFFFFF;\n  --ink-25: #FBF9F6;\n  --ink-50: #F5F1EB;\n  --ink-100: #EBE4DA;\n  --ink-200: #D9CFC0;\n  --ink-300: #BFB1A0;\n  --ink-400: #998A78;\n  --ink-500: #766A5C;\n  --ink-600: #584F44;\n  --ink-700: #3F3931;\n  --ink-800: #292520;\n  --ink-900: #1B1815;\n  --ink-950: #100E0C;\n\n  /* ---- Primitives: Rust (primary brand color) ---- */\n  --rust-50: #FDF3EE;\n  --rust-100: #FAE1D3;\n  --rust-200: #F3BFA2;\n  --rust-300: #E9986D;\n  --rust-400: #DB7548;\n  --rust-500: #C1502E;\n  --rust-600: #A43E22;\n  --rust-700: #83301B;\n  --rust-800: #62260A;\n  --rust-900: #451C09;\n\n  /* ---- Primitives: Forest (secondary brand color) ---- */\n  --forest-50: #EEF3ED;\n  --forest-100: #D6E3D3;\n  --forest-200: #AFC9A9;\n  --forest-300: #83AB79;\n  --forest-400: #5C8C52;\n  --forest-500: #3E6E36;\n  --forest-600: #2F5233;\n  --forest-700: #253F27;\n  --forest-800: #1B2E1D;\n  --forest-900: #121F14;\n\n  /* ---- Primitives: Slate (info) ---- */\n  --slate-50: #EEF1F5;\n  --slate-100: #D6DDE6;\n  --slate-300: #93A3B8;\n  --slate-500: #4C617D;\n  --slate-700: #2E3D51;\n\n  /* ---- Primitives: Amber (warning) ---- */\n  --amber-50: #FCF3DD;\n  --amber-300: #EFC463;\n  --amber-500: #C89A2E;\n  --amber-700: #8A6A17;\n\n  /* ---- Primitives: Brick (danger) ---- */\n  --brick-50: #FBEAE7;\n  --brick-300: #E3958A;\n  --brick-500: #B8412E;\n  --brick-700: #7C2A1D;\n\n  /* ================= Semantic aliases ================= */\n\n  /* Surfaces */\n  --surface-page: var(--ink-25);\n  --surface-card: var(--ink-0);\n  --surface-sunken: var(--ink-50);\n  --surface-inverse: var(--ink-900);\n  --surface-overlay: rgba(27, 24, 21, 0.48);\n\n  /* Text */\n  --text-primary: var(--ink-900);\n  --text-secondary: var(--ink-600);\n  --text-tertiary: var(--ink-400);\n  --text-inverse: var(--ink-25);\n  --text-on-accent: var(--ink-0);\n  --text-link: var(--rust-600);\n  --text-link-hover: var(--rust-700);\n\n  /* Borders */\n  --border-subtle: var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong: var(--ink-400);\n  --border-focus: var(--rust-500);\n\n  /* Brand / accent */\n  --color-primary: var(--rust-500);\n  --color-primary-hover: var(--rust-600);\n  --color-primary-active: var(--rust-700);\n  --color-primary-subtle: var(--rust-50);\n  --color-secondary: var(--forest-600);\n  --color-secondary-hover: var(--forest-700);\n  --color-secondary-subtle: var(--forest-50);\n\n  /* Semantic status */\n  --color-success: var(--forest-600);\n  --color-success-subtle: var(--forest-50);\n  --color-warning: var(--amber-500);\n  --color-warning-subtle: var(--amber-50);\n  --color-danger: var(--brick-500);\n  --color-danger-subtle: var(--brick-50);\n  --color-info: var(--slate-500);\n  --color-info-subtle: var(--slate-50);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(193, 80, 46, 0.28);\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   Stratal — Typographic scale\n   Fluid-ish fixed scale (1.2 ratio-ish, hand-tuned). Display sizes pair with\n   --font-serif-display; everything UI/body uses --font-sans.\n   ========================================================================== */\n\n:root {\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 30px;\n  --text-3xl: 38px;\n  --text-4xl: 48px;\n  --text-5xl: 64px;\n  --text-6xl: 84px;\n\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.55;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-wider: 0.12em;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   Stratal — Spacing, radius & layout tokens\n   4px base unit.\n   ========================================================================== */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n  --radius-xl: 20px;\n  --radius-full: 999px;\n\n  --container-max: 1160px;\n  --container-narrow: 720px;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   Stratal — Shadows, motion & focus\n   Shadows are soft, warm-tinted (using ink-900 not pure black), low-spread —\n   never a harsh drop shadow. Motion is quick and pu format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e1c48ab2-68da-474e-9db3-0bd64a76047b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6fc3a81c-3182-4b19-89f0-ca91707165a6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ca2e5318-6456-43f7-b089-6c155bae132e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e1c48ab2-68da-474e-9db3-0bd64a76047b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Newsreader — editorial serif, used sparingly for display headlines & pull quotes */\n  --font-serif-display: 'Newsreader', 'Iowan Old Style', 'Georgia', serif;\n\n  /* Manrope — geometric-humanist sans, the workhorse UI/body typeface */\n  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* IBM Plex Mono — code, data, numerals, technical labels */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;\n}\n\n/* ==========================================================================\n   Stratal — Color tokens\n   Warm-neutral ink scale + a rust/terracotta primary (deliberately not the\n   default SaaS blue-purple). Base primitives first, semantic aliases below.\n   ========================================================================== */\n\n:root {\n  /* ---- Primitives: Ink (warm neutral, slightly toward brown, not blue-gray) ---- */\n  --ink-0: #FFFFFF;\n  --ink-25: #FBF9F6;\n  --ink-50: #F5F1EB;\n  --ink-100: #EBE4DA;\n  --ink-200: #D9CFC0;\n  --ink-300: #BFB1A0;\n  --ink-400: #998A78;\n  --ink-500: #766A5C;\n  --ink-600: #584F44;\n  --ink-700: #3F3931;\n  --ink-800: #292520;\n  --ink-900: #1B1815;\n  --ink-950: #100E0C;\n\n  /* ---- Primitives: Rust (primary brand color) ---- */\n  --rust-50: #FDF3EE;\n  --rust-100: #FAE1D3;\n  --rust-200: #F3BFA2;\n  --rust-300: #E9986D;\n  --rust-400: #DB7548;\n  --rust-500: #C1502E;\n  --rust-600: #A43E22;\n  --rust-700: #83301B;\n  --rust-800: #62260A;\n  --rust-900: #451C09;\n\n  /* ---- Primitives: Forest (secondary brand color) ---- */\n  --forest-50: #EEF3ED;\n  --forest-100: #D6E3D3;\n  --forest-200: #AFC9A9;\n  --forest-300: #83AB79;\n  --forest-400: #5C8C52;\n  --forest-500: #3E6E36;\n  --forest-600: #2F5233;\n  --forest-700: #253F27;\n  --forest-800: #1B2E1D;\n  --forest-900: #121F14;\n\n  /* ---- Primitives: Slate (info) ---- */\n  --slate-50: #EEF1F5;\n  --slate-100: #D6DDE6;\n  --slate-300: #93A3B8;\n  --slate-500: #4C617D;\n  --slate-700: #2E3D51;\n\n  /* ---- Primitives: Amber (warning) ---- */\n  --amber-50: #FCF3DD;\n  --amber-300: #EFC463;\n  --amber-500: #C89A2E;\n  --amber-700: #8A6A17;\n\n  /* ---- Primitives: Brick (danger) ---- */\n  --brick-50: #FBEAE7;\n  --brick-300: #E3958A;\n  --brick-500: #B8412E;\n  --brick-700: #7C2A1D;\n\n  /* ================= Semantic aliases ================= */\n\n  /* Surfaces */\n  --surface-page: var(--ink-25);\n  --surface-card: var(--ink-0);\n  --surface-sunken: var(--ink-50);\n  --surface-inverse: var(--ink-900);\n  --surface-overlay: rgba(27, 24, 21, 0.48);\n\n  /* Text */\n  --text-primary: var(--ink-900);\n  --text-secondary: var(--ink-600);\n  --text-tertiary: var(--ink-400);\n  --text-inverse: var(--ink-25);\n  --text-on-accent: var(--ink-0);\n  --text-link: var(--rust-600);\n  --text-link-hover: var(--rust-700);\n\n  /* Borders */\n  --border-subtle: var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong: var(--ink-400);\n  --border-focus: var(--rust-500);\n\n  /* Brand / accent */\n  --color-primary: var(--rust-500);\n  --color-primary-hover: var(--rust-600);\n  --color-primary-active: var(--rust-700);\n  --color-primary-subtle: var(--rust-50);\n  --color-secondary: var(--forest-600);\n  --color-secondary-hover: var(--forest-700);\n  --color-secondary-subtle: var(--forest-50);\n\n  /* Semantic status */\n  --color-success: var(--forest-600);\n  --color-success-subtle: var(--forest-50);\n  --color-warning: var(--amber-500);\n  --color-warning-subtle: var(--amber-50);\n  --color-danger: var(--brick-500);\n  --color-danger-subtle: var(--brick-50);\n  --color-info: var(--slate-500);\n  --color-info-subtle: var(--slate-50);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(193, 80, 46, 0.28);\n}\n\n/* ==========================================================================\n   Stratal — Typographic scale\n   Fluid-ish fixed scale (1.2 ratio-ish, hand-tuned). Display sizes pair with\n   --font-serif-display; everything UI/body uses --font-sans.\n   ========================================================================== */\n\n:root {\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 30px;\n  --text-3xl: 38px;\n  --text-4xl: 48px;\n  --text-5xl: 64px;\n  --text-6xl: 84px;\n\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.55;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-wider: 0.12em;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n}\n\n/* ==========================================================================\n   Stratal — Spacing, radius & layout tokens\n   4px base unit.\n   ========================================================================== */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n  --radius-xl: 20px;\n  --radius-full: 999px;\n\n  --container-max: 1160px;\n  --container-narrow: 720px;\n}\n\n/* ==========================================================================\n   Stratal — Shadows, motion & focus\n   Shadows are soft, warm-tinted (using ink-900 not pure black), low-spread —\n   never a harsh drop shadow. Motion is quick and purposeful, no bounce.\n   ========================================================================== */\n\n:root {\n  --shadow-xs: 0 1px 2px rgba(27, 24, 21, 0.06);\n  --shadow-sm: 0 1px 3px rgba(27, 24, 21, 0.08), 0 1px 2px rgba(27, 24, 21, 0.05);\n  --shadow-md: 0 4px 10px rgba(27, 24, 21, 0.08), 0 2px 4px rgba(27, 24, 21, 0.06);\n  --shadow-lg: 0 12px 24px rgba(27, 24, 21, 0.10), 0 4px 8px rgba(27, 24, 21, 0.06);\n  --shadow-xl: 0 24px 48px rgba(27, 24, 21, 0.14), 0 8px 16px rgba(27, 24, 21, 0.08);\n\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n =\"auto,24px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"StratalDesignSystem_6ecd58.Button\" variant=\"danger\" size=\"sm\" sc-camel-on-click=\"{{ resetScore }}\" hint-size=\"auto,36px\">Reset current score<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fx-import>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultRoundsMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;10&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;5&quot;,&quot;10&quot;,&quot;15&quot;,&quot;endless&quot;],&quot;section&quot;:&quot;Game defaults&quot;},&quot;timerEnabledDefault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Game defaults&quot;},&quot;defaultWordTopic&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ALL&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;ALL&quot;,&quot;SCHOOL&quot;,&quot;FOOD&quot;,&quot;TRAVEL&quot;,&quot;ANIMALS&quot;,&quot;HOME&quot;],&quot;section&quot;:&quot;Game defaults&quot;}}\">\nfunction buildWords() {\n  const topics = {\n    Dog:'ANIMALS',Cat:'ANIMALS',School:'SCHOOL',Teacher:'SCHOOL',Friend:'SCHOOL',Family:'HOME',Birthday:'HOME',\n    Summer:'TRAVEL',Winter:'HOME',Phone:'HOME',Computer:'HOME',Pizza:'FOOD','Ice cream':'FOOD',House:'HOME',\n    Bedroom:'HOME',Park:'TRAVEL',Cinema:'TRAVEL',Holiday:'TRAVEL',Football:'SCHOOL',Music:'HOME',Book:'SCHOOL',\n    Monster:'HOME',Superhero:'HOME',Money:'HOME',Clothes:'HOME',Morning:'HOME',Weekend:'HOME',Rain:'TRAVEL',\n    Beach:'TRAVEL',Travel:'TRAVEL',Car:'TRAVEL',Bike:'TRAVEL',Food:'FOOD',Game:'HOME',Toy:'HOME',Animal:'ANIMALS',\n    City:'TRAVEL',Village:'TRAVEL',Party:'HOME',Chocolate:'FOOD',Internet:'HOME',Homework:'SCHOOL',Adventure:'TRAVEL',\n    Dream:'HOME',Restaurant:'FOOD',Zoo:'ANIMALS',Shopping:'TRAVEL',Movie:'HOME',Sport:'SCHOOL'\n  };\n  const ru = {\n    Dog:'собака',Cat:'кошка',School:'школа',Teacher:'учитель',Friend:'друг',Family:'семья',Birthday:'день рождения',\n    Summer:'лето',Winter:'зима',Phone:'телефон',Computer:'компьютер',Pizza:'пицца','Ice cream':'мороженое',House:'дом',\n    Bedroom:'спальня',Park:'парк',Cinema:'кинотеатр',Holiday:'праздник',Football:'футбол',Music:'музыка',Book:'книга',\n    Monster:'монстр',Superhero:'супергерой',Money:'деньги',Clothes:'одежда',Morning:'утро',Weekend:'выходные',Rain:'дождь',\n    Beach:'пляж',Travel:'путешествие',Car:'машина',Bike:'велосипед',Food:'еда',Game:'игра',Toy:'игрушка',Animal:'животное',\n    City:'город',Village:'деревня',Party:'вечеринка',Chocolate:'шоколад',Internet:'интернет',Homework:'домашнее задание',\n    Adventure:'приключение',Dream:'мечта',Restaurant:'ресторан',Zoo:'зоопарк',Shopping:'шоппинг',Movie:'фильм',Sport:'спорт'\n  };\n  return Object.keys(topics).map((en, i) => ({ id: 'w' + i, en, ru: ru[en], topic: topics[en], enabled: true, isCustom: false }));\n}\n\nfunction buildActions() {\n  const hints = {\n    'Explain it without saying the word': 'Объясни слово, не называя его.',\n    'What would happen if...?': 'Пофантазируй: что будет, если...?',\n    'Imagine it disappeared': 'Представь, что это исчезло. Что изменится?',\n    'Make up a problem with it': 'Придумай проблему, связанную с этим.',\n    'Convince me to buy it': 'Убеди меня купить это, как в рекламе.',\n    'Compare it with something': 'Сравни это с чем-то похожим или совсем другим.'\n  };\n  const list = ['Describe it','Tell a story','Say 3 things about it','Ask me 3 questions','Why do you like or dislike it?',\n    'Compare it with something','Imagine you have it','Explain it without saying the word','Make a funny sentence',\n    'Tell me about your experience','What can you do with it?','What would happen if...?','Convince me to buy it',\n    'Imagine it disappeared','Tell me when you last saw or used it','Make up a problem with it','Tell me why it is useful',\n    'Tell me why it is not useful'];\n  return list.map((en, i) => ({ id: 'a' + i, en, hint: hints[en] || null, enabled: true, isCustom: false }));\n}\n\nfunction buildTwists() {\n  const timers = { 'Speak for 20 seconds': 20, 'Speak for 30 seconds': 30 };\n  const list = ['Use \"because\"','Use \"but\"','Use \"and\"','Use \"can / can\\'t\"','Use \"I think…\"',\n    'Use \"I like / I don\\'t like…\"','Use Past Simple','Use Future Simple','Ask one question','Speak for 20 seconds',\n    'Speak for 30 seconds','Use 3 adjectives','Use at least 5 sentences','Use \"usually\"','Use \"sometimes\"',\n    'Use \"never\"','Use \"want to\"','Use \"have to\"'];\n  return list.map((en, i) => ({ id: 't' + i, en, timerSeconds: timers[en] || null, enabled: true, isCustom: false }));\n}\n\nconst TOPICS = ['ALL', 'SCHOOL', 'FOOD', 'TRAVEL', 'ANIMALS', 'HOME'];\nconst ROUNDS_CHOICES = [5, 10, 15, 'endless'];\nconst CIRC = 339.292;\n\nfunction resultTier(score, maxScore) {\n  const pct = maxScore > 0 ? score / maxScore : 0;\n  if (pct >= 0.86) return { title: 'English star!', sub: 'Outstanding speaking today.' };\n  if (pct >= 0.67) return { title: 'Amazing!', sub: 'You spoke so well.' };\n  if (pct >= 0.34) return { title: 'Great job!', sub: 'Solid speaking practice.' };\n  return { title: 'Good start!', sub: 'Nice first steps — keep going.' };\n}\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'start',\n    roundsMode: 10,\n    topicFilter: 'ALL',\n    timerEnabled: true,\n    words: buildWords(),\n    actions: buildActions(),\n    twists: buildTwists(),\n    round: 1,\n    score: 0,\n    streak: 0,\n    bestStreak: 0,\n    history: [],\n    phase: 'idle',\n    currentWord: null,\n    currentAction: null,\n    currentTwist: null,\n    wordTranslateShown: false,\n    actionHintShown: false,\n    timerActive: false,\n    timerDone: false,\n    timeLeft: 0,\n    timerDuration: 0,\n    rating: null,\n    teacherOpen: false,\n    howToOpen: false,\n    teacherTab: 'words',\n    newWordEn: '', newWordRu: '', newWordTopic: 'HOME',\n    newActionEn: '', newActionHint: '',\n    newTwistEn: '', newTwistTimer: '0'\n  };\n\n  componentDidMount() {\n    try {\n      const sw = localStorage.getItem('speakmore_v1_words');\n      const sa = localStorage.getItem('speakmore_v1_actions');\n      const st = localStorage.getItem('speakmore_v1_twists');\n      const ss = localStorage.getItem('speakmore_v1_settings');\n      const upd = {};\n      if (sw) upd.words = JSON.parse(sw);\n      if (sa) upd.actions = JSON.parse(sa);\n      if (st) upd.twists = JSON.parse(st);\n      if (ss) {\n        const s = JSON.parse(ss);\n        if (s.roundsMode !== undefined) upd.roundsMode = s.roundsMode;\n        if (s.timerEnabled !== undefined) upd.timerEnabled = s.timerEnabled;\n        if (s.topicFilter !== undefined) upd.topicFilter = s.topicFilter;\n      } else {\n        const rm = this.props.defaultRoundsMode;\n        if (rm) upd.roundsMode = rm === 'endless' ? 'endless' : Number(rm);\n        if (this.props.timerEnabledDefault !== undefined) upd.timerEnabled = this.props.timerEnabledDefault;\n        if (this.props.defaultWordTopic) upd.topicFilter = this.props.defaultWordTopic;\n      }\n      if (Object.keys(upd).length) this.setState(upd);\n    } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timerInterval);\n    clearTimeout(this.drawTimeout);\n  }\n\n  saveDeck(name) {\n    try { localStorage.setItem('speakmore_v1_' + name, JSON.stringify(this.state[name])); } catch (e) {}\n  }\n  saveSettings() {\n    try {\n      localStorage.setItem('speakmore_v1_settings', JSON.stringify({\n        roundsMode: this.state.roundsMode, timerEnabled: this.state.timerEnabled, topicFilter: this.state.topicFilter\n      }));\n    } catch (e) {}\n  }\n\n  pickCard(deckKey, excludeId) {\n    const arr = this.state[deckKey];\n    let pool = arr.filter(c => c.enabled);\n    if (deckKey === 'words' && this.state.topicFilter !== 'ALL') {\n      const topicPool = pool.filter(c => c.topic === this.state.topicFilter);\n      if (topicPool.length) pool = topicPool;\n    }\n    if (!pool.length) pool = arr;\n    if (!pool.length) return null;\n    let candidates = pool;\n    if (pool.length > 1 && excludeId != null) {\n      const filtered = pool.filter(c => c.id !== excludeId);\n      if (filtered.length) candidates = filtered;\n    }\n    return candidates[Math.floor(Math.random() * candidates.length)];\n  }\n\n  drawCards() {\n    if (this.state.phase !== 'idle') return;\n    this.setState({ phase: 'shaking' });\n    this.drawTimeout = setTimeout(() => {\n      const word = this.pickCard('words', this.state.currentWord ? this.state.currentWord.id : null);\n      const action = this.pickCard('actions', this.state.currentAction ? this.state.currentAction.id : null);\n      const twist = this.pickCard('twists', this.state.currentTwist ? this.state.currentTwist.id : null);\n      this.setState({\n        phase: 'revealed', currentWord: word, currentAction: action, currentTwist: twist,\n        wordTranslateShown: false, actionHintShown: false,\n        timerActive: false, timerDone: false, timeLeft: 0, rating: null\n      });\n    }, 450);\n  }\n\n  startTimer() {\n    const dur = this.state.currentTwist && this.state.currentTwist.timerSeconds;\n    if (!dur) return;\n    clearInterval(this.timerInterval);\n    this.setState({ timerActive: true, timerDone: false, timeLeft: dur, timerDuration: dur });\n    this.timerInterval = setInterval(() => {\n      this.setState(s => {\n        if (s.timeLeft <= 1) {\n          clearInterval(this.timerInterval);\n          return { timeLeft: 0, timerActive: false, timerDone: true };\n        }\n        return { timeLeft: s.timeLeft - 1 };\n      });\n    }, 1000);\n  }\n\n  rate(stars) {\n    if (this.state.phase !== 'revealed') return;\n    const newStreak = stars >= 2 ? this.state.streak + 1 : 0;\n    const bestStreak = Math.max(this.state.bestStreak, newStreak);\n    this.setState(s => ({\n      rating: stars, score: s.score + stars, streak: newStreak, bestStreak,\n      phase: 'rated', history: [...s.history, stars]\n    }));\n  }\n\n  nextRound() {\n    clearInterval(this.timerInterval);\n    const isLast = this.state.roundsMode !== 'endless' && this.state.round >= this.state.roundsMode;\n    if (isLast) { this.setState({ screen: 'end' }); return; }\n    this.setState(s => ({ round: s.round + 1, phase: 'idle', rating: null, timerActive: false, timerDone: false, timeLeft: 0 }));\n  }\n\n  finishEndless() { clearInterval(this.timerInterval); this.setState({ screen: 'end' }); }\n\n  startGame() {\n    this.saveSettings();\n    this.setState({\n      screen: 'play', round: 1, score: 0, streak: 0, bestStreak: 0, history: [], phase: 'idle',\n      currentWord: null, currentAction: null, currentTwist: null\n    });\n  }\n  playAgain() {\n    this.setState({\n      screen: 'play', round: 1, score: 0, streak: 0, bestStreak: 0, history: [], phase: 'idle',\n      currentWord: null, currentAction: null, currentTwist: null\n    });\n  }\n  newGame() { this.setState({ screen: 'start' }); }\n\n  toggleTranslate() { this.setState(s => ({ wordTranslateShown: !s.wordTranslateShown })); }\n  toggleActionHint() { this.setState(s => ({ actionHintShown: !s.actionHintShown })); }\n\n  openTeacher() { this.setState({ teacherOpen: true }); }\n  closeTeacher() { this.setState({ teacherOpen: false }); }\n  openHowTo() { this.setState({ howToOpen: true }); }\n  closeHowTo() { this.setState({ howToOpen: false }); }\n\n  setTeacherTab(v) { this.setState({ teacherTab: v }); }\n  setRoundsMode(v) { this.setState({ roundsMode: v }, () => this.saveSettings()); }\n  setTopicFilter(v) { this.setState({ topicFilter: v }, () => this.saveSettings()); }\n  setTimerEnabled(v) { this.setState({ timerEnabled: v }, () => this.saveSettings()); }\n\n  toggleCard(deck, id) {\n    this.setState(s => ({ [deck]: s[deck].map(c => c.id === id ? { ...c, enabled: !c.enabled } : c) }), () => this.saveDeck(deck));\n  }\n  removeCustom(deck, id) {\n    this.setState(s => ({ [deck]: s[deck].filter(c => c.id !== id) }), () => this.saveDeck(deck));\n  }\n  resetScore() { this.setState({ score: 0, streak: 0, bestStreak: 0, history: [] }); }\n\n  setNewWordEn(v) { this.setState({ newWordEn: v }); }\n  setNewWordRu(v) { this.setState({ newWordRu: v }); }\n  setNewWordTopic(v) { this.setState({ newWordTopic: v }); }\n  addWord() {\n    const en = this.state.newWordEn.trim();\n    if (!en) return;\n    const card = { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), en, ru: this.state.newWordRu.trim(), topic: this.state.newWordTopic, enabled: true, isCustom: true };\n    this.setState(s => ({ words: [...s.words, card], newWordEn: '', newWordRu: '' }), () => this.saveDeck('words'));\n  }\n\n  setNewActionEn(v) { this.setState({ newActionEn: v }); }\n  setNewActionHint(v) { this.setState({ newActionHint: v }); }\n  addAction() {\n    const en = this.state.newActionEn.trim();\n    if (!en) return;\n    const card = { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), en, hint: this.state.newActionHint.trim() || null, enabled: true, isCustom: true };\n    this.setState(s => ({ actions: [...s.actions, card], newActionEn: '', newActionHint: '' }), () => this.saveDeck('actions'));\n  }\n\n  setNewTwistEn(v) { this.setState({ newTwistEn: v }); }\n  setNewTwistTimer(v) { this.setState({ newTwistTimer: v }); }\n  addTwist() {\n    const en = this.state.newTwistEn.trim();\n    if (!en) return;\n    const timerSeconds = parseInt(this.state.newTwistTimer, 10) || null;\n    const card = { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), en, timerSeconds, enabled: true, isCustom: true };\n    this.setState(s => ({ twists: [...s.twists, card], newTwistEn: '', newTwistTimer: '0' }), () => this.saveDeck('twists'));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const cardsIdle = s.phase === 'idle' || s.phase === 'shaking';\n    const cardsShown = s.phase === 'revealed' || s.phase === 'rated';\n    const isRated = s.phase === 'rated';\n    const isEndless = s.roundsMode === 'endless';\n\n    const roundsOptions = ROUNDS_CHOICES.map(v => ({\n      value: String(v), label: v === 'endless' ? 'Endless' : v + ' rounds',\n      variant: s.roundsMode === v ? 'primary' : 'secondary',\n      onClick: () => this.setRoundsMode(v)\n    }));\n    const topicOptions = TOPICS.map(t => ({\n      value: t, label: t,\n      variant: s.topicFilter === t ? 'primary' : 'secondary',\n      onClick: () => this.setTopicFilter(t)\n    }));\n\n    const timerDur = s.currentTwist && s.currentTwist.timerSeconds;\n    const isTimerLow = s.timerActive && s.timeLeft <= 5;\n    const timerDashoffset = s.timerDuration > 0 ? CIRC * (1 - s.timeLeft / s.timerDuration) : 0;\n\n    const maxScore = (isEndless ? s.history.length : s.roundsMode) * 3;\n    const tier = resultTier(s.score, maxScore);\n\n    const LucideIcon = window.LucideIcon;\n    const removeIcon = LucideIcon ? React.createElement(LucideIcon, { name: 'trash-2', size: 16 }) : null;\n    const settingsIconEl = LucideIcon ? React.createElement(LucideIcon, { name: 'graduation-cap', size: 16 }) : null;\n\n    const wordRows = s.words.map(w => ({ id: w.id, label: w.en + (w.ru ? ' — ' + w.ru : ''), enabled: w.enabled, isCustom: w.isCustom, onToggle: () => this.toggleCard('words', w.id), onRemove: () => this.removeCustom('words', w.id), removeIcon }));\n    const actionRows = s.actions.map(a => ({ id: a.id, label: a.en, enabled: a.enabled, isCustom: a.isCustom, onToggle: () => this.toggleCard('actions', a.id), onRemove: () => this.removeCustom('actions', a.id), removeIcon }));\n    const twistRows = s.twists.map(t => ({ id: t.id, label: t.en + (t.timerSeconds ? ' (' + t.timerSeconds + 's timer)' : ''), enabled: t.enabled, isCustom: t.isCustom, onToggle: () => this.toggleCard('twists', t.id), onRemove: () => this.removeCustom('twists', t.id), removeIcon }));\n\n    const ratingBase = 'border:2px solid var(--border-subtle);background:var(--surface-card);';\n    const ratingSelected = 'border:2px solid var(--color-primary);background:var(--color-primary-subtle);animation:popIn 0.4s cubic-bezier(.34,1.56,.64,1) both;';\n\n    return {\n      isStart: s.screen === 'start', isPlay: s.screen === 'play', isEnd: s.screen === 'end',\n      roundsOptions, topicOptions,\n      startGame: () => this.startGame(),\n      openHowTo: () => this.openHowTo(), closeHowTo: () => this.closeHowTo(), howToOpen: s.howToOpen,\n      openTeacher: () => this.openTeacher(), closeTeacher: () => this.closeTeacher(), teacherOpen: s.teacherOpen,\n      howToSteps: [\n        { n: '1', text: 'Draw three cards.' }, { n: '2', text: 'Read the task.' }, { n: '3', text: 'Speak English.' },\n        { n: '4', text: 'Earn stars.' }, { n: '5', text: 'Try to beat your score.' }\n      ],\n\n      roundLabel: isEndless ? 'Round ' + s.round : 'Round ' + s.round + ' / ' + s.roundsMode,\n      isEndless, finishEndless: () => this.finishEndless(),\n      settingsIcon: settingsIconEl,\n      score: s.score, scoreKey: s.score, scorePopStyle: s.rating != null ? 'animation:scorePop 0.5s cubic-bezier(.34,1.56,.64,1);' : '',\n      streakVisible: s.streak >= 2, streakLabel: s.streak + ' round streak',\n\n      cardsIdle, cardsShown, isRated,\n      shakeStyle: s.phase === 'shaking' ? 'animation:shake 0.4s ease-in-out;' : '',\n      currentWord: s.currentWord || { en: '', ru: '' },\n      wordFontSize: (() => {\n        const len = Math.max(3, ...((s.currentWord && s.currentWord.en) || 'Word').split(' ').map(p => p.length));\n        return 'min(48px, ' + (135 / len).toFixed(1) + 'cqi)';\n      })(),\n      currentAction: s.currentAction || { en: '', hint: null },\n      currentTwist: s.currentTwist || { en: '' },\n      wordTranslateShown: s.wordTranslateShown, toggleTranslate: () => this.toggleTranslate(),\n      translateLabel: s.wordTranslateShown ? 'Hide translation' : 'Translate',\n      actionHintShown: s.actionHintShown, toggleActionHint: () => this.toggleActionHint(),\n\n      showTimerStart: s.timerEnabled && !!timerDur && !s.timerActive && !s.timerDone,\n      showTimerRing: s.timerEnabled && s.timerActive,\n      timerDone: s.timerEnabled && s.timerDone,\n      startTimer: () => this.startTimer(),\n      timerRingColor: isTimerLow ? 'var(--brick-500)' : 'var(--color-primary)',\n      timerDashoffset, timerSecondsLabel: String(s.timeLeft).padStart(2, '0'),\n      timerPulseStyle: isTimerLow ? 'animation:timerPulse 0.6s ease-in-out infinite;' : '',\n\n      drawCards: () => this.drawCards(),\n      rate1: () => this.rate(1), rate2: () => this.rate(2), rate3: () => this.rate(3),\n      ratingStyle1: s.rating === 1 ? ratingSelected : ratingBase,\n      ratingStyle2: s.rating === 2 ? ratingSelected : ratingBase,\n      ratingStyle3: s.rating === 3 ? ratingSelected : ratingBase,\n      nextRound: () => this.nextRound(),\n      nextButtonLabel: (!isEndless && s.round >= s.roundsMode) ? 'See results' : 'Next round',\n\n      tierTitle: tier.title, tierSub: tier.sub,\n      roundsCompletedLabel: isEndless ? String(s.history.length) : s.roundsMode + '/' + s.roundsMode,\n      bestStreak: s.bestStreak,\n      playAgain: () => this.playAgain(), newGame: () => this.newGame(),\n\n      teacherTabs: [{ label: 'Words', value: 'words' }, { label: 'Actions', value: 'actions' }, { label: 'Twists', value: 'twists' }, { label: 'Settings', value: 'settings' }],\n      teacherTab: s.teacherTab, setTeacherTab: v => this.setTeacherTab(v),\n      isWordsTab: s.teacherTab === 'words', isActionsTab: s.teacherTab === 'actions', isTwistsTab: s.teacherTab === 'twists', isSettingsTab: s.teacherTab === 'settings',\n      wordRows, actionRows, twistRows,\n\n      newWordEn: s.newWordEn, setNewWordEn: v => this.setNewWordEn(v),\n      newWordRu: s.newWordRu, setNewWordRu: v => this.setNewWordRu(v),\n      newWordTopic: s.newWordTopic, setNewWordTopic: v => this.setNewWordTopic(v),\n      topicSelectOptions: [{ label: 'School', value: 'SCHOOL' }, { label: 'Food', value: 'FOOD' }, { label: 'Travel', value: 'TRAVEL' }, { label: 'Animals', value: 'ANIMALS' }, { label: 'Home', value: 'HOME' }],\n      addWord: () => this.addWord(),\n\n      newActionEn: s.newActionEn, setNewActionEn: v => this.setNewActionEn(v),\n      newActionHint: s.newActionHint, setNewActionHint: v => this.setNewActionHint(v),\n      addAction: () => this.addAction(),\n\n      newTwistEn: s.newTwistEn, setNewTwistEn: v => this.setNewTwistEn(v),\n      newTwistTimer: s.newTwistTimer, setNewTwistTimer: v => this.setNewTwistTimer(v),\n      timerSelectOptions: [{ label: 'No timer', value: '0' }, { label: '20 seconds', value: '20' }, { label: '30 seconds', value: '30' }],\n      addTwist: () => this.addTwist(),\n\n      timerEnabled: s.timerEnabled, setTimerEnabled: v => this.setTimerEnabled(v),\n      resetScore: () => this.resetScore()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
